<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4f46e5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Shield Background Path -->
  <path
    d="M16 2.5 L27 6.5 C27 18 16 28 16 29.5 C16 28 5 18 5 6.5 L16 2.5 Z"
    fill="url(#shieldGrad)"
    filter="url(#glow)"
  />
  <!-- Inner Shield Highlight -->
  <path
    d="M16 4.5 L25 8 C25 17.5 16 26 16 27 C16 26 7 17.5 7 8 L16 4.5 Z"
    fill="#0f172a"
    fill-opacity="0.25"
  />
  <!-- Tick / Checkmark Path -->
  <path
    d="M11 15.5 L14.5 19 L21.5 12"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>