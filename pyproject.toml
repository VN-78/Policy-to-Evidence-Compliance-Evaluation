[project]
name = "fastapi-base-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "VN-78", email = "vishwanath.s.god@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pytest>=9.1.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
fastapi-base-template = "fastapi_base_template:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.ruff]
# Enable Pyflakes (F), pycodestyle (E), and isort (I)
lint.select = ["E", "F", "I"]
line-length = 88

[tool.ruff.lint.isort]
# Forces Ruff to group your imports exactly like the diagram above
known-first-party = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]

